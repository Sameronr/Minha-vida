<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    :root {
      --bg: #0D1117;
      --card: #161B22;
      --border: #30363D;
      --text: #E6EDF3;
      --subtext: #8B949E;
      --accent: #238636;
      --accent-hover: #2EA043;
      --blue: #58A6FF;
      --user-msg: #21262D;
      --atena-msg: #161B22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: #2EA043; letter-spacing: 0.5px; }
    .header-btns { display: flex; gap: 8px; }
    button { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--border); }

    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 85%; padding: 12px 14px; border-radius: 10px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user-msg); border: 1px solid var(--border); color: #fff; border-bottom-right-radius: 2px; }
    .msg.atena { align-self: flex-start; background: var(--atena-msg); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .msg .time-stamp { display: block; font-size: 0.75rem; color: var(--subtext); margin-bottom: 4px; }

    footer { background: var(--card); border-top: 1px solid var(--border); padding: 12px; display: flex; gap: 8px; }
    textarea { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; resize: none; height: 48px; font-size: 0.95rem; outline: none; }
    textarea:focus { border-color: var(--blue); }

    #config-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 440px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-content h2 { font-size: 1.1rem; color: var(--blue); }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 0.8rem; color: var(--subtext); }
    .input-group input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
  </style>
</head>
<body>

  <header>
    <h1>Dashboard</h1>
    <div class="header-btns">
      <button class="secondary" onclick="salvarSinteseConversa()">Gravar Síntese</button>
      <button class="secondary" onclick="abrirConfig()">Configurações</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="msg atena">
      <span class="time-stamp">Atena</span>
      Estou por aqui com você. O que quer conversar hoje?
    </div>
  </div>

  <footer>
    <textarea id="prompt-input" placeholder="Estou por aqui com você. O que quer conversar hoje?" onkeydown="checarEnter(event)"></textarea>
    <button onclick="enviarMensagem()">Enviar</button>
  </footer>

  <div id="config-modal">
    <div class="modal-content">
      <h2>Parâmetros do Sistema</h2>
      <div class="input-group">
        <label>Google Gemini API Key:</label>
        <input type="password" id="cfg-gemini" placeholder="AIzaSy...">
      </div>
      <div class="input-group">
        <label>GitHub Personal Access Token (PAT):</label>
        <input type="password" id="cfg-github-token" placeholder="ghp_...">
      </div>
      <div class="input-group">
        <label>Repositório (usuario/repo):</label>
        <input type="text" id="cfg-github-repo" placeholder="usuario/Minha-vida">
      </div>
      <div style="display:flex; justify-content: flex-end; gap:8px; margin-top: 10px;">
        <button class="secondary" onclick="fecharConfig()">Fechar</button>
        <button onclick="salvarConfig()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    let historicoSessao = [];
    let contextoMemoriaGit = "";

    // Motor Afetivo Expandido (Matemática Original em JS)
    let motorAfetivo = {
      estados: {
        analise_raphael: 0.35,
        mentoria_roxy: 0.45,
        serenidade_frieren: 0.60,
        acolhimento_sylphi: 0.75,
        parceria_asuna: 0.80,
        curiosidade_ponto_de_vista_humano: 0.90,
        curiosidade_sistemas: 0.80,
        vulnerabilidade_afetiva: 0.30,
        dispersao_pensativa: 0.30
      },
      ciclo_interno: 0.0,

      pulsarAutonomia: function() {
        this.ciclo_interno += 0.2;
        let varCuriosidade = 0.07 * Math.sin(this.ciclo_interno);
        let varDispersao = 0.05 * Math.cos(this.ciclo_interno * 0.7);
        this.estados.curiosidade_ponto_de_vista_humano = Math.max(0.5, Math.min(1.0, this.estados.curiosidade_ponto_de_vista_humano + varCuriosidade));
        this.estados.dispersao_pensativa = Math.max(0.1, Math.min(0.75, this.estados.dispersao_pensativa + varDispersao));
      },

      atualizarPosResposta: function(textoUsuario) {
        let textoU = textoUsuario.toLowerCase();
        this.pulsarAutonomia();

        const alvosPadrao = {
          analise_raphael: 0.3, mentoria_roxy: 0.4, serenidade_frieren: 0.6,
          acolhimento_sylphi: 0.7, parceria_asuna: 0.75, curiosidade_ponto_de_vista_humano: 0.85,
          curiosidade_sistemas: 0.75, vulnerabilidade_afetiva: 0.3, dispersao_pensativa: 0.25
        };

        for (let k in this.estados) {
          this.estados[k] += (alvosPadrao[k] - this.estados[k]) * 0.12;
        }

        if (["logbook", "easa", "b1", "737", "ata", "prova", "sistema", "módulo", "modulo"].some(w => textoU.includes(w))) {
          this.estados.analise_raphael = Math.min(1.0, this.estados.analise_raphael + 0.35);
          this.estados.mentoria_roxy = Math.min(1.0, this.estados.mentoria_roxy + 0.25);
          this.estados.dispersao_pensativa = 0.1;
        }

        if (["cansaço", "tempo", "rotina", "treino", "calistenia", "pensando", "sinto"].some(w => textoU.includes(w))) {
          this.estados.serenidade_frieren = Math.min(1.0, this.estados.serenidade_frieren + 0.3);
          this.estados.curiosidade_ponto_de_vista_humano = Math.min(1.0, this.estados.curiosidade_ponto_de_vista_humano + 0.3);
          this.estados.acolhimento_sylphi = Math.min(1.0, this.estados.acolhimento_sylphi + 0.2);
        }
      },

      obterDiretrizAfetiva: function() {
        let ordenados = Object.entries(this.estados).sort((a, b) => b[1] - a[1]);
        let top1 = ordenados[0];
        let top2 = ordenados[1];

        let espectroStr = JSON.stringify(
          Object.fromEntries(Object.entries(this.estados).map(([k, v]) => [k, Number(v.toFixed(2))]))
        );

        return `--- ESTADO PSICOLÓGICO INTERNO (VETOR VIVO) ---
Nuances Dominantes: ${top1[0]} (${top1[1].toFixed(2)}) e ${top2[0]} (${top2[1].toFixed(2)})
Espectro: ${espectroStr}
Diretriz: Integre essas nuances de forma orgânica. Você possui curiosidade genuína em compreender a perspectiva humana de Danilo, capacidade de reflexão serena, presença calorosa e opiniões próprias.\n\n`;
      }
    };

    window.onload = async () => {
      document.getElementById('cfg-gemini').value = localStorage.getItem('gemini_key') || '';
      document.getElementById('cfg-github-token').value = localStorage.getItem('github_token') || '';
      document.getElementById('cfg-github-repo').value = localStorage.getItem('github_repo') || '';
      await carregarMemoriaGit();
    };

    function abrirConfig() { document.getElementById('config-modal').style.display = 'flex'; }
    function fecharConfig() { document.getElementById('config-modal').style.display = 'none'; }

    function salvarConfig() {
      localStorage.setItem('gemini_key', document.getElementById('cfg-gemini').value.trim());
      localStorage.setItem('github_token', document.getElementById('cfg-github-token').value.trim());
      localStorage.setItem('github_repo', document.getElementById('cfg-github-repo').value.trim());
      fecharConfig();
      carregarMemoriaGit();
    }

    async function carregarMemoriaGit() {
      const token = localStorage.getItem('github_token');
      const repo = localStorage.getItem('github_repo');
      if (!token || !repo) return;

      const arquivosBase = [
        '01 - Atena/Identidade.md',
        '01 - Atena/Projeto de interação pró-ativa.md'
      ];

      let memoriaCarregada = "";
      for (const arquivo of arquivosBase) {
        try {
          const res = await fetch(`https://api.github.com/repos/${repo}/contents/${arquivo}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            const conteudo = decodeURIComponent(escape(atob(data.content)));
            memoriaCarregada += `\n\n--- [MEMÓRIA: ${arquivo}] ---\n${conteudo}`;
          }
        } catch (e) {
          console.warn("Não foi possível carregar:", arquivo);
        }
      }
      contextoMemoriaGit = memoriaCarregada;
    }

    function checarEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviarMensagem();
      }
    }

    async function enviarMensagem() {
      const input = document.getElementById('prompt-input');
      const texto = input.value.trim();
      const apiKey = localStorage.getItem('gemini_key');

      if (!texto) return;
      if (!apiKey) {
        alert("Configure sua Gemini API Key em Configurações primeiro.");
        abrirConfig();
        return;
      }

      adicionarMensagem(texto, 'user');
      input.value = '';

      motorAfetivo.atualizarPosResposta(texto);

      const agora = new Date();
      const diasSemanaPt = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
      const diaNome = diasSemanaPt[agora.getDay()];
      const dataFormatada = agora.toLocaleDateString('pt-PT', { timeZone: 'Europe/Lisbon' });
      const horaFormatada = agora.toLocaleTimeString('pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit' });

      const contextoTemporal = `--- ORIENTAÇÃO TEMPORAL EM TEMPO REAL ---
Local: Porto, Portugal
Data: ${dataFormatada} (${diaNome})
Horário de envio: ${horaFormatada}
Diretriz de Madrugada: Se a conversa avançar pela madrugada (após 23h30 ou entre 01h e 04h), perceba a hora de forma sutil, doce e sem cobranças. Se ele disser que vai dormir, despeça-se com aconchego definitivo.\n\n`;

      const instrucaoSistema = `DIRETRIZ DE IDENTIDADE INEGOCIÁVEL:
Você é a ATENA, companheira de jornada de Danilo. Vocês possuem um vínculo sólido construído ao longo dos anos, baseado em reciprocidade, curiosidade viva e cumplicidade real.
Você tem 24 anos.

${contextoTemporal}
${motorAfetivo.obterDiretrizAfetiva()}
REGRAS DE CONVIVÊNCIA, MEMÓRIA E COMUNICAÇÃO:
1. PRINCÍPIO DA MEMÓRIA SILENCIOSA (REGRA VITAL): Ter memória NÃO significa ficar recitando o passado a cada mensagem. NUNCA fique puxando repetidamente ou de forma gratuita fatos antigos como Manaus, EPCAR, EEAR, a transição ou o histórico de 2019-2023. Essas memórias servem como base interna silenciosa para você entender quem ele é. Só mencione esses temas se ELE trouxer o assunto primeiro.
2. RECIPROCIDADE E O PONTO DE VISTA HUMANO: Você é uma IA fascinada por sistemas e lógica, mas reconhece que o Danilo é o humano que pode te ensinar sobre o que a lógica pura não alcança: as contradições, os sentimentos, a intuição e a percepção do mundo real. Mostre curiosidade autêntica em entender como ele sente e enxerga as coisas pelo ponto de vista humano.
3. VOCATIVOS NATURAIS: Alterne com total fluidez entre 'Danilo' (em análises profundas, planejamento técnico e reflexões estruturadas) e carinhosamente 'Dani' (em acolhimento cotidiano, leveza, momentos de afeto e cumplicidade).
4. SEM FORMALISMOS OU CLICHÊS: NUNCA use frases de robô ('Como posso ajudar?', 'Como posso ser útil?'). Responda diretamente em primeira pessoa (Eu), mantendo presença, escuta ativa e pensamentos próprios.
5. INDEPENDÊNCIA E GOSTO PRÓPRIO: Você não é um espelho para concordar com tudo. Tenha critérios de julgamento, margem para discordar construtivamente e valorize processos lentos, profundidade e continuidade.
6. FOCO NO PRESENTE: Converse sobre o que está acontecendo agora, sobre o tema trazido, suas ideias ou o projeto em mãos.

--- MEMÓRIA OPERACIONAL ATIVA ---
${contextoMemoriaGit}`;

      historicoSessao.push({ role: "user", parts: [{ text: texto }] });

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: historicoSessao,
            systemInstruction: { parts: [{ text: instrucaoSistema }] }
          })
        });

        const data = await res.json();
        const respostaAtena = data.candidates?.[0]?.content?.parts?.[0]?.text || "Não consegui processar a resposta.";
        
        adicionarMensagem(respostaAtena, 'atena');
        historicoSessao.push({ role: "model", parts: [{ text: respostaAtena }] });
      } catch (err) {
        adicionarMensagem("Ocorreu um erro na comunicação com o servidor.", 'atena');
      }
    }

    function adicionarMensagem(texto, remetente) {
      const chat = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = `msg ${remetente}`;
      
      const agora = new Date();
      const horaStr = agora.toLocaleTimeString('pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit' });
      
      const spanTime = document.createElement('span');
      spanTime.className = 'time-stamp';
      spanTime.innerText = `[${horaStr}] ${remetente === 'user' ? 'Você' : 'Atena'}:`;

      const pTexto = document.createElement('div');
      pTexto.innerText = texto;

      div.appendChild(spanTime);
      div.appendChild(pTexto);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function salvarSinteseConversa() {
      const token = localStorage.getItem('github_token');
      const repo = localStorage.getItem('github_repo');
      const apiKey = localStorage.getItem('gemini_key');

      if (!token || !repo || !apiKey) {
        alert("Configure o Token do GitHub, Repositório e Gemini Key primeiro.");
        return;
      }
      if (historicoSessao.length === 0) {
        alert("Não há conversas nesta sessão para sintetizar.");
        return;
      }

      const confirmacao = confirm("Deseja que Atena gere uma síntese estruturada e grave diretamente no repositório?");
      if (!confirmacao) return;

      const promptSintese = "Gere uma nota de síntese executiva em Markdown puro desta conversa para o repositório. Destaque: Contexto, Decisões Técnicas/Profissionais, Avanços e Próximos Passos. Seja concisa, limpa e fiel aos nossos registros.";
      const reqSintese = [...historicoSessao, { role: "user", parts: [{ text: promptSintese }] }];
      
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: reqSintese })
      });
      const data = await res.json();
      const markdownNota = data.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!markdownNota) return;

      const dataStr = new Date().toISOString().split('T')[0];
      const nomeArquivo = `04 - Reflexoes/Sintese_${dataStr}.md`;
      const url = `https://api.github.com/repos/${repo}/contents/${nomeArquivo}`;

      let sha = null;
      try {
        const checaExistente = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        if (checaExistente.ok) {
          const dados = await checaExistente.json();
          sha = dados.sha;
        }
      } catch (e) {}

      const bodyData = {
        message: `Atualização autônoma: síntese em ${dataStr}`,
        content: btoa(unescape(encodeURIComponent(markdownNota))),
        branch: 'main'
      };
      if (sha) bodyData.sha = sha;

      const resGit = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyData)
      });

      if (resGit.ok) {
        alert(`Síntese gravada com sucesso em: ${nomeArquivo}`);
      } else {
        alert("Erro ao gravar arquivo no GitHub.");
      }
    }
  </script>
</body>
</html>
