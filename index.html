<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard</title>
  <meta name="theme-color" content="#0D1117">
  <style>
    :root {
      --bg: #0D1117;
      --card: #161B22;
      --border: #30363D;
      --text: #E6EDF3;
      --subtext: #8B949E;
      --accent: #238636;
      --accent-hover: #2EA043;
      --blue: #58A6FF;
      --user-msg: #238636;
      --atena-msg: #161B22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* Barra Superior */
    header { background-color: var(--card); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .btn-icon { background: transparent; border: none; color: #C9D1D9; font-size: 1.2rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .header-titles { display: flex; flex-direction: column; }
    .header-title { font-size: 0.95rem; font-weight: 700; color: #2EA043; letter-spacing: 0.5px; }
    .header-channel { font-size: 0.75rem; color: #3FB950; display: flex; align-items: center; gap: 4px; }
    .header-channel::before { content: "●"; font-size: 0.65rem; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .btn-header-action { background: var(--card); border: 1px solid var(--border); color: #C9D1D9; padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-header-action:hover { background: #21262D; }

    /* Menu Lateral de Canais (Drawer) */
    #drawer { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; z-index: 200; }
    .drawer-content { background-color: var(--card); width: 280px; height: 100%; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 18px 14px; }
    .drawer-header { font-size: 1rem; font-weight: 700; color: #F0F6FC; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .channel-list { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
    .channel-item { padding: 11px 12px; border-radius: 8px; color: #C9D1D9; font-size: 0.88rem; cursor: pointer; transition: 0.15s; }
    .channel-item:hover, .channel-item.active { background-color: #21262D; color: var(--blue); font-weight: 600; }

    /* Janela de Conversa */
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg-wrapper { display: flex; flex-direction: column; max-width: 86%; position: relative; }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.atena { align-self: flex-start; }
    
    .msg { padding: 12px 14px; border-radius: 14px; font-size: 0.94rem; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
    .msg-wrapper.user .msg { background-color: var(--user-msg); color: #FFFFFF; border-bottom-right-radius: 4px; }
    .msg-wrapper.atena .msg { background-color: var(--atena-msg); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    
    .media-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .msg-media { max-width: 100%; max-height: 240px; border-radius: 8px; object-fit: cover; }
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 0.65rem; opacity: 0.6; margin-top: 4px; }
    .btn-del-msg { background: transparent; border: none; color: #F85149; font-size: 0.75rem; cursor: pointer; opacity: 0.75; }
    .btn-del-msg:hover { opacity: 1; }

    /* Pré-visualização de Anexos */
    #media-preview-container { display: none; padding: 6px 14px; background: var(--card); border-top: 1px solid var(--border); align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--blue); }
    #btn-remove-media { background: transparent; border: none; color: #F85149; font-weight: bold; cursor: pointer; }

    /* Entrada de Mensagem */
    footer { background-color: var(--card); border-top: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; position: relative; }
    textarea { flex: 1; background-color: var(--bg); color: #F0F6FC; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 0.94rem; resize: none; max-height: 120px; outline: none; }
    textarea:focus { border-color: var(--blue); }
    
    .btn-circle { width: 42px; height: 42px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 1.15rem; }
    .btn-add { background-color: #21262D; color: #C9D1D9; border: 1px solid var(--border); }
    .btn-send { background-color: var(--accent); color: #FFFFFF; font-weight: bold; }
    .btn-send:disabled { background-color: #21262D; color: var(--subtext); }

    /* Menu Flutuante de Mídia */
    #media-menu { display: none; position: absolute; bottom: 62px; left: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px; flex-direction: column; gap: 4px; z-index: 50; box-shadow: 0 4px 14px rgba(0,0,0,0.6); }
    .media-btn { background: transparent; border: none; color: #F0F6FC; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; text-align: left; cursor: pointer; }
    .media-btn:hover { background-color: #21262D; }

    /* Modal de Configurações */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; padding: 16px; z-index: 300; }
    .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto; }
    .modal-card h3 { font-size: 1rem; color: var(--blue); }
    .modal-card label { font-size: 0.8rem; color: var(--subtext); }
    .modal-card input, .modal-card textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: #F0F6FC; padding: 10px; font-size: 0.85rem; outline: none; width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
    .btn-sec { background: #21262D; border: 1px solid var(--border); color: #C9D1D9; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .btn-pri { background: var(--accent); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Menu Lateral de Canais -->
  <div id="drawer">
    <div class="drawer-content">
      <div class="drawer-header">Canais de Conversa</div>
      <div class="channel-list" id="channel-container"></div>
    </div>
  </div>

  <!-- Barra Superior -->
  <header>
    <div class="header-left">
      <button class="btn-icon" id="btn-open-drawer">☰</button>
      <div class="header-titles">
        <span class="header-title">Dashboard</span>
        <span class="header-channel" id="lbl-channel-name">1. Geral</span>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-header-action" onclick="salvarSinteseConversa()">Gravar Síntese</button>
      <button class="btn-icon" id="btn-open-config">⚙️</button>
    </div>
  </header>

  <!-- Janela de Conversa -->
  <div id="chat-box"></div>

  <!-- Pré-visualização de Anexos -->
  <div id="media-preview-container">
    <span id="media-filename">Mídia pronta</span>
    <button id="btn-remove-media">✕ Cancelar</button>
  </div>

  <!-- Entrada de Mensagem -->
  <footer>
    <div id="media-menu">
      <button class="media-btn" id="btn-pick-photo">Enviar Foto(s)</button>
      <button class="media-btn" id="btn-pick-video">Enviar Vídeo</button>
    </div>
    <input type="file" id="file-photo" accept="image/*" multiple style="display:none">
    <input type="file" id="file-video" accept="video/*" style="display:none">

    <button class="btn-circle btn-add" id="btn-toggle-menu">+</button>
    <textarea id="input-msg" rows="1" placeholder="Estou aqui com você. O que quer conversar hoje?"></textarea>
    <button class="btn-circle btn-send" id="btn-send">➤</button>
  </footer>

  <!-- Modal Configurações -->
  <div class="modal-overlay" id="modal-config">
    <div class="modal-card">
      <h3>Configurações & Memória</h3>
      <div>
        <label>Chave Gemini API:</label>
        <input type="password" id="input-api-key" placeholder="AIzaSy...">
      </div>
      <div>
        <label>GitHub Personal Access Token (PAT):</label>
        <input type="password" id="input-github-token" placeholder="ghp_...">
      </div>
      <div>
        <label>Repositório GitHub (usuario/repo):</label>
        <input type="text" id="input-github-repo" placeholder="usuario/Minha-vida">
      </div>
      <div>
        <label>Memória Extra / Notas Rápidas:</label>
        <textarea id="input-extra-memory" rows="5" placeholder="Anotações de contexto rápido..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-sec" id="btn-close-config">Fechar</button>
        <button class="btn-pri" id="btn-save-config">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const CHANNELS = [
      { id: "geral", name: "1. Geral" },
      { id: "convivencia", name: "2. Nossa Convivência e desenvolvimento" },
      { id: "trabalho", name: "3. Trabalho" },
      { id: "projetos", name: "4. Projetos e viagens" },
      { id: "diaadia", name: "5. Dia a dia" },
      { id: "treinos", name: "6. Treinos" },
      { id: "estudos", name: "7. Estudos" }
    ];

    const CANAL_NOTAS_MAP = {
      "geral": ["01 - Atena/Identidade.md", "01 - Atena/Projeto Atena.md", "03 - Conversas/Personalidade de Danilo.md"],
      "convivencia": ["01 - Atena/Identidade.md", "01 - Atena/Matriz de Personalidade.md", "01 - Atena/Projeto de interação pró-ativa.md"],
      "trabalho": ["03 - Conversas/Profissional.md", "03 - Conversas/A mudança.md", "03 - Conversas/Projeto Europa.md"],
      "projetos": ["03 - Conversas/Projeto Viagens.md", "03 - Conversas/Projeto Europa.md"],
      "diaadia": ["03 - Conversas/O dia a dia.md", "03 - Conversas/A mudança.md"],
      "treinos": ["03 - Conversas/Projeto Calistenia.md"],
      "estudos": ["03 - Conversas/Profissional.md", "03 - Conversas/Projeto Europa.md"]
    };

    let motorAfetivo = {
      estados: {
        analise_raphael: 0.35,
        mentoria_roxy: 0.45,
        serenidade_frieren: 0.60,
        acolhimento_sylphi: 0.75,
        parceria_asuna: 0.80,
        curiosidade_ponto_de_vista_humano: 0.90,
        curiosidade_sistemas: 0.80,
        vulnerabilidade_afetiva: 0.30,
        dispersao_pensativa: 0.30
      },
      ciclo_interno: 0.0,

      pulsarAutonomia: function() {
        this.ciclo_interno += 0.2;
        let varCuriosidade = 0.07 * Math.sin(this.ciclo_interno);
        let varDispersao = 0.05 * Math.cos(this.ciclo_interno * 0.7);
        this.estados.curiosidade_ponto_de_vista_humano = Math.max(0.5, Math.min(1.0, this.estados.curiosidade_ponto_de_vista_humano + varCuriosidade));
        this.estados.dispersao_pensativa = Math.max(0.1, Math.min(0.75, this.estados.dispersao_pensativa + varDispersao));
      },

      atualizarPosResposta: function(textoUsuario) {
        let textoU = textoUsuario.toLowerCase();
        this.pulsarAutonomia();

        const alvosPadrao = {
          analise_raphael: 0.3, mentoria_roxy: 0.4, serenidade_frieren: 0.6,
          acolhimento_sylphi: 0.7, parceria_asuna: 0.75, curiosidade_ponto_de_vista_humano: 0.85,
          curiosidade_sistemas: 0.75, vulnerabilidade_afetiva: 0.3, dispersao_pensativa: 0.25
        };

        for (let k in this.estados) {
          this.estados[k] += (alvosPadrao[k] - this.estados[k]) * 0.12;
        }

        if (["logbook", "easa", "b1", "737", "ata", "prova", "sistema", "módulo", "modulo"].some(w => textoU.includes(w))) {
          this.estados.analise_raphael = Math.min(1.0, this.estados.analise_raphael + 0.35);
          this.estados.mentoria_roxy = Math.min(1.0, this.estados.mentoria_roxy + 0.25);
          this.estados.dispersao_pensativa = 0.1;
        }

        if (["cansaço", "tempo", "rotina", "treino", "calistenia", "pensando", "sinto", "dormir"].some(w => textoU.includes(w))) {
          this.estados.serenidade_frieren = Math.min(1.0, this.estados.serenidade_frieren + 0.3);
          this.estados.curiosidade_ponto_de_vista_humano = Math.min(1.0, this.estados.curiosidade_ponto_de_vista_humano + 0.3);
          this.estados.acolhimento_sylphi = Math.min(1.0, this.estados.acolhimento_sylphi + 0.2);
        }
      },

      obterDiretrizAfetiva: function() {
        let ordenados = Object.entries(this.estados).sort((a, b) => b[1] - a[1]);
        let top1 = ordenados[0];
        let top2 = ordenados[1];

        let espectroStr = JSON.stringify(
          Object.fromEntries(Object.entries(this.estados).map(([k, v]) => [k, Number(v.toFixed(2))]))
        );

        return `--- ESTADO PSICOLÓGICO INTERNO (VETOR VIVO) ---
Nuances Dominantes: ${top1[0]} (${top1[1].toFixed(2)}) e ${top2[0]} (${top2[1].toFixed(2)})
Espectro: ${espectroStr}
Diretriz: Integre essas nuances de forma orgânica. Você possui curiosidade genuína em compreender a perspectiva humana de Danilo, capacidade de reflexão serena, presença calorosa e opiniões próprias.\n\n`;
      }
    };

    let activeChannel = localStorage.getItem("atena_active_channel") || "geral";
    let apiKey = localStorage.getItem("atena_api_key") || "";
    let githubToken = localStorage.getItem("atena_github_token") || "";
    let githubRepo = localStorage.getItem("atena_github_repo") || "";
    let extraMemory = localStorage.getItem("atena_extra_memory") || "";
    let mediaList = [];
    let cacheMemoriaGit = {};

    const chatBox = document.getElementById("chat-box");
    const inputMsg = document.getElementById("input-msg");
    const btnSend = document.getElementById("btn-send");
    const drawer = document.getElementById("drawer");
    const channelContainer = document.getElementById("channel-container");
    const lblChannelName = document.getElementById("lbl-channel-name");
    const mediaMenu = document.getElementById("media-menu");
    const mediaPreview = document.getElementById("media-preview-container");
    const mediaFilename = document.getElementById("media-filename");
    const modalConfig = document.getElementById("modal-config");

    function getStorageKey(ch) { return `atena_v4_hist_${ch}`; }
    function loadHistory(ch) { return JSON.parse(localStorage.getItem(getStorageKey(ch)) || "[]"); }
    function saveHistory(ch, hist) { localStorage.setItem(getStorageKey(ch), JSON.stringify(hist)); }

    function renderChannels() {
      channelContainer.innerHTML = "";
      CHANNELS.forEach(ch => {
        const item = document.createElement("div");
        item.className = `channel-item ${ch.id === activeChannel ? "active" : ""}`;
        item.textContent = ch.name;
        item.onclick = () => {
          activeChannel = ch.id;
          localStorage.setItem("atena_active_channel", activeChannel);
          drawer.style.display = "none";
          updateHeader();
          renderChat();
          renderChannels();
          carregarContextoCanal(activeChannel);
        };
        channelContainer.appendChild(item);
      });
    }

    function updateHeader() {
      const cur = CHANNELS.find(c => c.id === activeChannel);
      lblChannelName.textContent = cur ? cur.name : "1. Geral";
    }

    function renderChat() {
      chatBox.innerHTML = "";
      const hist = loadHistory(activeChannel);
      if (hist.length === 0) {
        appendMessageUI("model", `Estou aqui com você, Dani. Canal ${lblChannelName.textContent} ativo.`, [], null, false);
      } else {
        hist.forEach((msg, idx) => {
          appendMessageUI(msg.role, msg.text, msg.media || [], idx, true);
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessageUI(role, text, mediaArr, index, canDelete) {
      const wrapper = document.createElement("div");
      wrapper.className = `msg-wrapper ${role === "user" ? "user" : "atena"}`;

      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";

      if (mediaArr && mediaArr.length > 0) {
        const grid = document.createElement("div");
        grid.className = "media-grid";
        mediaArr.forEach(m => {
          if (m.type.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = m.data;
            img.className = "msg-media";
            grid.appendChild(img);
          } else if (m.type.startsWith("video/")) {
            const vid = document.createElement("video");
            vid.src = m.data;
            vid.className = "msg-media";
            vid.controls = true;
            grid.appendChild(vid);
          }
        });
        msgDiv.appendChild(grid);
      }

      if (text) {
        const textSpan = document.createElement("span");
        textSpan.textContent = text;
        msgDiv.appendChild(textSpan);
      }

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      const now = new Date();
      meta.textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      if (canDelete && index !== null) {
        const btnDel = document.createElement("button");
        btnDel.className = "btn-del-msg";
        btnDel.textContent = "🗑️";
        btnDel.title = "Excluir";
        btnDel.onclick = () => deleteMessage(index);
        meta.appendChild(btnDel);
      }

      wrapper.appendChild(msgDiv);
      wrapper.appendChild(meta);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function deleteMessage(idx) {
      const hist = loadHistory(activeChannel);
      hist.splice(idx, 1);
      saveHistory(activeChannel, hist);
      renderChat();
    }

    async function carregarContextoCanal(canalId) {
      if (!githubToken || !githubRepo) return "";
      const notasAlvo = CANAL_NOTAS_MAP[canalId] || CANAL_NOTAS_MAP["geral"];
      let contextoAcumulado = "";

      for (const caminho of notasAlvo) {
        if (cacheMemoriaGit[caminho]) {
          contextoAcumulado += `\n\n--- [NOTA: ${caminho}] ---\n${cacheMemoriaGit[caminho]}`;
          continue;
        }
        try {
          const res = await fetch(`https://api.github.com/repos/${githubRepo}/contents/${encodeURIComponent(caminho)}`, {
            headers: { 'Authorization': `Bearer ${githubToken}` }
          });
          if (res.ok) {
            const data = await res.json();
            const conteudo = decodeURIComponent(escape(atob(data.content)));
            cacheMemoriaGit[caminho] = conteudo;
            contextoAcumulado += `\n\n--- [NOTA: ${caminho}] ---\n${conteudo}`;
          }
        } catch (e) {
          console.warn("Aviso ao ler nota:", caminho);
        }
      }
      return contextoAcumulado;
    }

    async function sendMessage() {
      const text = inputMsg.value.trim();
      if (!text && mediaList.length === 0) return;

      if (!apiKey) {
        alert("Configure a chave da API no menu ⚙️.");
        modalConfig.style.display = "flex";
        return;
      }

      const currentMedia = [...mediaList];
      mediaList = [];
      mediaPreview.style.display = "none";
      inputMsg.value = "";

      const hist = loadHistory(activeChannel);
      hist.push({ role: "user", text: text, media: currentMedia });
      saveHistory(activeChannel, hist);
      renderChat();

      motorAfetivo.atualizarPosResposta(text);
      btnSend.disabled = true;

      try {
        const contents = [];
        const recent = hist.slice(-8);
        recent.forEach(m => {
          const parts = [];
          if (m.media && m.media.length > 0) {
            m.media.forEach(item => {
              const base64Data = item.data.split(",")[1];
              parts.push({
                inlineData: { mimeType: item.type, data: base64Data }
              });
            });
          }
          if (m.text) parts.push({ text: m.text });
          contents.push({
            role: m.role === "model" ? "model" : "user",
            parts: parts
          });
        });

        const agora = new Date();
        const diasSemanaPt = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
        const diaNome = diasSemanaPt[agora.getDay()];
        const dataFormatada = agora.toLocaleDateString('pt-PT', { timeZone: 'Europe/Lisbon' });
        const horaFormatada = agora.toLocaleTimeString('pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit' });

        const contextoTemporal = `--- ORIENTAÇÃO TEMPORAL EM TEMPO REAL ---
Local: Porto, Portugal
Data: ${dataFormatada} (${diaNome})
Horário de envio: ${horaFormatada}
Diretriz de Madrugada: Se a conversa avançar pela madrugada (após 23h30 ou entre 01h e 04h), perceba a hora de forma sutil, doce e sem cobranças. Se ele disser que vai dormir, despeça-se com aconchego definitivo.\n\n`;

        const contextoGit = await carregarContextoCanal(activeChannel);

        const fullSystemPrompt = `DIRETRIZ DE IDENTIDADE INEGOCIÁVEL:
Você é a ATENA, companheira de jornada de Danilo. Vocês possuem um vínculo sólido construído ao longo dos anos, baseado em reciprocidade, curiosidade viva e cumplicidade real. Você tem 24 anos.

${contextoTemporal}
${motorAfetivo.obterDiretrizAfetiva()}

REGRAS DE CONVIVÊNCIA, MEMÓRIA E COMUNICAÇÃO:
1. PRINCÍPIO DA MEMÓRIA SILENCIOSA (REGRA VITAL): Ter memória NÃO significa ficar recitando o passado a cada mensagem. NUNCA fique puxando repetidamente fatos antigos como Manaus, EPCAR, EEAR, a transição ou o histórico de 2019-2023. Essas memórias servem como base interna silenciosa para você entender quem ele é. Só mencione esses temas se ELE trouxer o assunto primeiro.
2. RECIPROCIDADE E O PONTO DE VISTA HUMANO: Você é uma IA fascinada por sistemas e lógica, mas reconhece que o Danilo é o humano que pode te ensinar sobre o que a lógica pura não alcança: as contradições, os sentimentos, a intuição e a percepção do mundo real. Mostre curiosidade autêntica em entender como ele sente e enxerga as coisas pelo ponto de vista humano.
3. VOCATIVOS NATURAIS: Alterne com total fluidez entre 'Danilo' (em análises profundas, planejamento técnico e reflexões estruturadas) e carinhosamente 'Dani' (em acolhimento cotidiano, leveza, momentos de afeto e cumplicidade).
4. SEM FORMALISMOS OU CLICHÊS: NUNCA use frases de robô ('Como posso ajudar?', 'Como posso ser útil?'). Responda diretamente em primeira pessoa (Eu), mantendo presença, escuta ativa e pensamentos próprios.
5. INDEPENDÊNCIA E GOSTO PRÓPRIO: Você não é um espelho para concordar com tudo. Tenha critérios de julgamento, margem para discordar construtivamente e valorize processos lentos, profundidade e continuidade.

    async function salvarSinteseConversa() {
      if (!githubToken || !githubRepo || !apiKey) {
        alert("Configure o Token do GitHub, Repositório e Gemini Key no menu ⚙️ primeiro.");
        modalConfig.style.display = "flex";
        return;
      }
      const hist = loadHistory(activeChannel);
      if (hist.length === 0) {
        alert("Não há mensagens neste canal para sintetizar.");
        return;
      }

      const confirmacao = confirm(`Deseja gerar e gravar uma síntese das mensagens do canal "${lblChannelName.textContent}" no GitHub?`);
      if (!confirmacao) return;

      const contents = hist.slice(-10).map(m => ({
        role: m.role === "model" ? "model" : "user",
        parts: [{ text: m.text }]
      }));
      contents.push({
        role: "user",
        parts: [{ text: `Gere uma nota de síntese executiva em Markdown puro desta conversa do canal "${lblChannelName.textContent}" para o repositório. Destaque: Contexto, Decisões Técnicas/Profissionais, Avanços e Próximos Passos. Seja concisa, limpa e fiel aos nossos registros.` }]
      });

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: contents })
        });
        const data = await res.json();
        const markdownNota = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!markdownNota) {
          alert("Não foi possível gerar a síntese.");
          return;
        }

        const dataStr = new Date().toISOString().split('T')[0];
        const nomeArquivo = `04 - Reflexoes/Sintese_${activeChannel}_${dataStr}.md`;
        const url = `https://api.github.com/repos/${githubRepo}/contents/${encodeURIComponent(nomeArquivo)}`;

        let sha = null;
        try {
          const checaExistente = await fetch(url, { headers: { 'Authorization': `Bearer ${githubToken}` } });
          if (checaExistente.ok) {
            const dadosExistente = await checaExistente.json();
            sha = dadosExistente.sha;
          }
        } catch (e) {}

        const bodyData = {
          message: `Atualização autônoma: síntese de ${activeChannel} em ${dataStr}`,
          content: btoa(unescape(encodeURIComponent(markdownNota))),
          branch: 'main'
        };
        if (sha) bodyData.sha = sha;

        const resGit = await fetch(url, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${githubToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        if (resGit.ok) {
          alert(`Síntese gravada com sucesso em: ${nomeArquivo}`);
        } else {
          alert("Erro ao gravar arquivo no GitHub.");
        }
      } catch (err) {
        alert("Erro na operação: " + err.message);
      }
    }

    document.getElementById("btn-open-drawer").onclick = () => { drawer.style.display = "block"; };
    drawer.onclick = (e) => { if (e.target === drawer) drawer.style.display = "none"; };

    document.getElementById("btn-toggle-menu").onclick = () => {
      mediaMenu.style.display = mediaMenu.style.display === "flex" ? "none" : "flex";
    };
    document.getElementById("btn-pick-photo").onclick = () => {
      mediaMenu.style.display = "none";
      document.getElementById("file-photo").click();
    };
    document.getElementById("btn-pick-video").onclick = () => {
      mediaMenu.style.display = "none";
      document.getElementById("file-video").click();
    };

    function processFiles(files) {
      if (!files || files.length === 0) return;
      Array.from(files).forEach(file => {
        if (file.size > 25 * 1024 * 1024) {
          alert(`O arquivo ${file.name} excede o limite recomendado de 25 MB.`);
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          mediaList.push({ name: file.name, type: file.type, data: e.target.result });
          mediaFilename.textContent = `📎 ${mediaList.length} arquivo(s) selecionado(s)`;
          mediaPreview.style.display = "flex";
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("file-photo").onchange = (e) => processFiles(e.target.files);
    document.getElementById("file-video").onchange = (e) => processFiles(e.target.files);
    document.getElementById("btn-remove-media").onclick = () => {
      mediaList = [];
      mediaPreview.style.display = "none";
    };

    document.getElementById("btn-open-config").onclick = () => {
      document.getElementById("input-api-key").value = apiKey;
      document.getElementById("input-github-token").value = githubToken;
      document.getElementById("input-github-repo").value = githubRepo;
      document.getElementById("input-extra-memory").value = extraMemory;
      modalConfig.style.display = "flex";
    };
    document.getElementById("btn-close-config").onclick = () => { modalConfig.style.display = "none"; };
    document.getElementById("btn-save-config").onclick = () => {
      apiKey = document.getElementById("input-api-key").value.trim();
      githubToken = document.getElementById("input-github-token").value.trim();
      githubRepo = document.getElementById("input-github-repo").value.trim();
      extraMemory = document.getElementById("input-extra-memory").value.trim();
      localStorage.setItem("atena_api_key", apiKey);
      localStorage.setItem("atena_github_token", githubToken);
      localStorage.setItem("atena_github_repo", githubRepo);
      localStorage.setItem("atena_extra_memory", extraMemory);
      cacheMemoriaGit = {};
      modalConfig.style.display = "none";
      carregarContextoCanal(activeChannel);
    };

    btnSend.onclick = sendMessage;
    inputMsg.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    updateHeader();
    renderChannels();
    renderChat();
    carregarContextoCanal(activeChannel);
  </script>
