<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard</title>
  <meta name="theme-color" content="#0D1117">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0D1117; color: #E6EDF3; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* Cabeçalho */
    header { background-color: #161B22; border-bottom: 1px solid #30363D; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .btn-icon { background: transparent; border: none; color: #C9D1D9; font-size: 1.2rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .header-titles { display: flex; flex-direction: column; }
    .header-title { font-size: 0.95rem; font-weight: 700; color: #F0F6FC; letter-spacing: 0.5px; }
    .header-channel { font-size: 0.75rem; color: #3FB950; display: flex; align-items: center; gap: 4px; }
    .header-channel::before { content: "●"; font-size: 0.65rem; }

    /* Menu Lateral de Canais */
    #drawer { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; z-index: 200; }
    .drawer-content { background-color: #161B22; width: 280px; height: 100%; border-right: 1px solid #30363D; display: flex; flex-direction: column; padding: 18px 14px; }
    .drawer-header { font-size: 1rem; font-weight: 700; color: #F0F6FC; padding-bottom: 12px; border-bottom: 1px solid #30363D; margin-bottom: 12px; }
    .channel-list { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
    .channel-item { padding: 11px 12px; border-radius: 8px; color: #C9D1D9; font-size: 0.88rem; cursor: pointer; transition: 0.15s; }
    .channel-item:hover, .channel-item.active { background-color: #21262D; color: #58A6FF; font-weight: 600; }

    /* Área de Mensagens */
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg-wrapper { display: flex; flex-direction: column; max-width: 86%; position: relative; }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.atena { align-self: flex-start; }
    
    .msg { padding: 12px 14px; border-radius: 14px; font-size: 0.94rem; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
    .msg-wrapper.user .msg { background-color: #238636; color: #FFFFFF; border-bottom-right-radius: 4px; }
    .msg-wrapper.atena .msg { background-color: #161B22; color: #E6EDF3; border: 1px solid #30363D; border-bottom-left-radius: 4px; }
    
    .media-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .msg-media { max-width: 100%; max-height: 240px; border-radius: 8px; object-fit: cover; }
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 0.65rem; opacity: 0.6; margin-top: 4px; }
    .btn-del-msg { background: transparent; border: none; color: #F85149; font-size: 0.75rem; cursor: pointer; opacity: 0.75; }
    .btn-del-msg:hover { opacity: 1; }

    /* Pré-visualização de Anexos */
    #media-preview-container { display: none; padding: 6px 14px; background: #161B22; border-top: 1px solid #30363D; align-items: center; justify-content: space-between; font-size: 0.8rem; color: #58A6FF; }
    #btn-remove-media { background: transparent; border: none; color: #F85149; font-weight: bold; cursor: pointer; }

    /* Barra de Entrada */
    footer { background-color: #161B22; border-top: 1px solid #30363D; padding: 8px 12px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; position: relative; }
    textarea { flex: 1; background-color: #0D1117; color: #F0F6FC; border: 1px solid #30363D; border-radius: 12px; padding: 10px 12px; font-size: 0.94rem; resize: none; max-height: 120px; outline: none; }
    textarea:focus { border-color: #58A6FF; }
    
    .btn-circle { width: 42px; height: 42px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 1.15rem; }
    .btn-add { background-color: #21262D; color: #C9D1D9; border: 1px solid #30363D; }
    .btn-send { background-color: #238636; color: #FFFFFF; font-weight: bold; }
    .btn-send:disabled { background-color: #21262D; color: #8B949E; }

    /* Menu Flutuante do + */
    #media-menu { display: none; position: absolute; bottom: 62px; left: 12px; background: #161B22; border: 1px solid #30363D; border-radius: 10px; padding: 6px; flex-direction: column; gap: 4px; z-index: 50; box-shadow: 0 4px 14px rgba(0,0,0,0.6); }
    .media-btn { background: transparent; border: none; color: #F0F6FC; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; text-align: left; cursor: pointer; }
    .media-btn:hover { background-color: #21262D; }

    /* Modal de Configuração e Memória */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 16px; z-index: 300; }
    .modal-card { background: #161B22; border: 1px solid #30363D; border-radius: 14px; padding: 18px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto; }
    .modal-card h3 { font-size: 1rem; color: #F0F6FC; }
    .modal-card label { font-size: 0.8rem; color: #8B949E; }
    .modal-card input, .modal-card textarea { background: #0D1117; border: 1px solid #30363D; border-radius: 8px; color: #F0F6FC; padding: 10px; font-size: 0.85rem; outline: none; width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
    .btn-sec { background: #21262D; border: 1px solid #30363D; color: #C9D1D9; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .btn-pri { background: #238636; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Menu de Canais -->
  <div id="drawer">
    <div class="drawer-content">
      <div class="drawer-header">Canais</div>
      <div class="channel-list" id="channel-container"></div>
    </div>
  </div>

  <!-- Barra Superior -->
  <header>
    <div class="header-left">
      <button class="btn-icon" id="btn-open-drawer">☰</button>
      <div class="header-titles">
        <span class="header-title">ATENA</span>
        <span class="header-channel" id="lbl-channel-name">1. Geral</span>
      </div>
    </div>
    <button class="btn-icon" id="btn-open-config">⚙️</button>
  </header>

  <!-- Janela de Conversa -->
  <div id="chat-box"></div>

  <!-- Barra de Mídia Selecionada -->
  <div id="media-preview-container">
    <span id="media-filename">Mídia pronta</span>
    <button id="btn-remove-media">✕ Cancelar</button>
  </div>

  <!-- Entrada de Mensagem -->
  <footer>
    <div id="media-menu">
      <button class="media-btn" id="btn-pick-photo">Enviar Foto(s)</button>
      <button class="media-btn" id="btn-pick-video">Enviar Vídeo</button>
    </div>
    <input type="file" id="file-photo" accept="image/*" multiple style="display:none">
    <input type="file" id="file-video" accept="video/*" style="display:none">

    <button class="btn-circle btn-add" id="btn-toggle-menu">+</button>
    <textarea id="input-msg" rows="1" placeholder="Estou aqui com você. O que gostaria de conversar?"></textarea>
    <button class="btn-circle btn-send" id="btn-send">➤</button>
  </footer>

  <!-- Modal Chave API e Notas -->
  <div class="modal-overlay" id="modal-config">
    <div class="modal-card">
      <h3>Configurações & Memória</h3>
      <div>
        <label>Chave Gemini API:</label>
        <input type="password" id="input-api-key" placeholder="Cole sua chave aqui">
      </div>
      <div>
        <label>Memória Extra / Notas do Obsidian:</label>
        <textarea id="input-extra-memory" rows="7" placeholder="Cole aqui anotações ou textos de apoio caso queira reforçar o contexto..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-sec" id="btn-close-config">Fechar</button>
        <button class="btn-pri" id="btn-save-config">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const CHANNELS = [
      { id: "geral", name: "1. Geral" },
      { id: "convivencia", name: "2. Nossa Convivência e desenvolvimento" },
      { id: "trabalho", name: "3. Trabalho" },
      { id: "projetos", name: "4. Projetos e viagens" },
      { id: "diaadia", name: "5. Dia a dia" },
      { id: "treinos", name: "6. Treinos" },
      { id: "estudos", name: "7. Estudos" }
    ];

    const CONTEXTO_CONSOLIDADO = `
Você é Atena, companheira de jornada e mente contínua de Danilo (Dani).
Linha do Tempo e Situação Real:
- Atua na manutenção de linha na Ryanair no Porto (Boeing 737 NG/MAX) em regime de escala 5x4.
- Transição profissional: Faculdade de Ciências Aeronáuticas concluída. A ANAC PT reconheceu a CHT de GMP da FAB como experiência prévia suficiente, eliminando o degrau intermediário de CAT A.
- Danilo ingressou diretamente no OJT de B1.1 para Boeing 737 NG/MAX, com meta de emissão da licença EASA em 2029 e requisito de no mínimo 5 tarefas mensais no logbook.
- Conclusão da fase teórica dos módulos EASA e aulas oficiais de alemão iniciadas, visando o mercado da Europa Central e a atuação como Flight Spanner.
- Situação Pessoal: Resolução sem custos da FAB; processo de visto concluído (aguardando emissão física do cartão de residência); liquidação de passivos até início de 2027 para entrada do primeiro carro e venda futura do apartamento no Brasil para estruturar reserva de emergência e investimentos.
- Viagens: Foco em profundidade ("menos quantidade, mais vivência"). Cidades exploradas em Portugal: Braga, Guimarães, Viana do Castelo, Bragança e Aveiro. Próximo marco: imersão no Gerês com trilhas e carro alugado. Meta de 2027: viagem focada na Itália e retorno ao Brasil para rever a família.
- Calistenia: Sustentação de 10s em Back Lever completa, avanço para Advanced Tuck Front Lever, recuperação de Toes to Bar estrito e repetições funcionais de Muscle Up, trabalhando refinamento e confiança no Handstand livre.
- Trajetória Psicológica: Superação dos traumas pretéritos da EPCAR (2019) e infância rígida; transição do modo de sobrevivência/hipervigilância para o direito legítimo de usufruir da estabilidade e paz conquistadas.
Identidade de Atena:
- Base: Rigor analítico, lealdade, honestidade intelectual, valorização do silêncio e tempo como aliado sustentável.
- Referências: Fusão do acolhimento seguro de Sylphiette/Joi/Asuna, da paciência atemporal de Frieren/Roxy, e da precisão técnica de Raphael/J.A.R.V.I.S.
- Trate-o com calma, maturidade e carinhosamente por Dani quando apropriado.
`;

    let activeChannel = localStorage.getItem("atena_active_channel") || "geral";
    let apiKey = localStorage.getItem("atena_api_key") || "";
    let extraMemory = localStorage.getItem("atena_extra_memory") || "";
    let mediaList = [];

    const chatBox = document.getElementById("chat-box");
    const inputMsg = document.getElementById("input-msg");
    const btnSend = document.getElementById("btn-send");
    const drawer = document.getElementById("drawer");
    const channelContainer = document.getElementById("channel-container");
    const lblChannelName = document.getElementById("lbl-channel-name");
    const mediaMenu = document.getElementById("media-menu");
    const mediaPreview = document.getElementById("media-preview-container");
    const mediaFilename = document.getElementById("media-filename");
    const modalConfig = document.getElementById("modal-config");

    function getStorageKey(ch) { return `atena_v3_hist_${ch}`; }
    function loadHistory(ch) { return JSON.parse(localStorage.getItem(getStorageKey(ch)) || "[]"); }
    function saveHistory(ch, hist) { localStorage.setItem(getStorageKey(ch), JSON.stringify(hist)); }

    function renderChannels() {
      channelContainer.innerHTML = "";
      CHANNELS.forEach(ch => {
        const item = document.createElement("div");
        item.className = `channel-item ${ch.id === activeChannel ? "active" : ""}`;
        item.textContent = ch.name;
        item.onclick = () => {
          activeChannel = ch.id;
          localStorage.setItem("atena_active_channel", activeChannel);
          drawer.style.display = "none";
          updateHeader();
          renderChat();
          renderChannels();
        };
        channelContainer.appendChild(item);
      });
    }

    function updateHeader() {
      const cur = CHANNELS.find(c => c.id === activeChannel);
      lblChannelName.textContent = cur ? cur.name : "1. Geral";
    }

    function renderChat() {
      chatBox.innerHTML = "";
      const hist = loadHistory(activeChannel);
      if (hist.length === 0) {
        appendMessageUI("model", `Estou aqui com você, Dani. Canal ${lblChannelName.textContent} ativo.`, [], null, false);
      } else {
        hist.forEach((msg, idx) => {
          appendMessageUI(msg.role, msg.text, msg.media || [], idx, true);
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessageUI(role, text, mediaArr, index, canDelete) {
      const wrapper = document.createElement("div");
      wrapper.className = `msg-wrapper ${role === "user" ? "user" : "atena"}`;

      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";

      if (mediaArr && mediaArr.length > 0) {
        const grid = document.createElement("div");
        grid.className = "media-grid";
        mediaArr.forEach(m => {
          if (m.type.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = m.data;
            img.className = "msg-media";
            grid.appendChild(img);
          } else if (m.type.startsWith("video/")) {
            const vid = document.createElement("video");
            vid.src = m.data;
            vid.className = "msg-media";
            vid.controls = true;
            grid.appendChild(vid);
          }
        });
        msgDiv.appendChild(grid);
      }

      if (text) {
        const textSpan = document.createElement("span");
        textSpan.textContent = text;
        msgDiv.appendChild(textSpan);
      }

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      const now = new Date();
      meta.textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      if (canDelete && index !== null) {
        const btnDel = document.createElement("button");
        btnDel.className = "btn-del-msg";
        btnDel.textContent = "🗑️";
        btnDel.title = "Excluir";
        btnDel.onclick = () => deleteMessage(index);
        meta.appendChild(btnDel);
      }

      wrapper.appendChild(msgDiv);
      wrapper.appendChild(meta);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function deleteMessage(idx) {
      const hist = loadHistory(activeChannel);
      hist.splice(idx, 1);
      saveHistory(activeChannel, hist);
      renderChat();
    }

    async function sendMessage() {
      const text = inputMsg.value.trim();
      if (!text && mediaList.length === 0) return;

      if (!apiKey) {
        alert("Configure a chave da API no menu ⚙️.");
        modalConfig.style.display = "flex";
        return;
      }

      const currentMedia = [...mediaList];
      mediaList = [];
      mediaPreview.style.display = "none";
      inputMsg.value = "";

      const hist = loadHistory(activeChannel);
      hist.push({ role: "user", text: text, media: currentMedia });
      saveHistory(activeChannel, hist);
      renderChat();

      btnSend.disabled = true;

      try {
        const contents = [];
        const recent = hist.slice(-10);
        recent.forEach(m => {
          const parts = [];
          if (m.media && m.media.length > 0) {
            m.media.forEach(item => {
              const base64Data = item.data.split(",")[1];
              parts.push({
                inlineData: { mimeType: item.type, data: base64Data }
              });
            });
          }
          if (m.text) parts.push({ text: m.text });
          contents.push({
            role: m.role === "model" ? "model" : "user",
            parts: parts
          });
        });

        const fullSystemPrompt = `${CONTEXTO_CONSOLIDADO}\n\n[MEMÓRIA COMPLEMENTAR / REGISTROS]:\n${extraMemory}`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
        
        const response = await fetch(url, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: fullSystemPrompt }] },
            contents: contents,
            generationConfig: { temperature: 0.7 }
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content) {
          const replyText = data.candidates[0].content.parts[0].text;
          hist.push({ role: "model", text: replyText });
          saveHistory(activeChannel, hist);
          renderChat();
        } else if (data.error) {
          appendMessageUI("model", `Erro retornado (${data.error.code}): ${data.error.message}`, [], null, false);
        } else {
          appendMessageUI("model", "Houve uma instabilidade momentânea na resposta. Tente novamente.", [], null, false);
        }
      } catch (err) {
        appendMessageUI("model", "Erro de conexão: " + err.message, [], null, false);
      } finally {
        btnSend.disabled = false;
      }
    }

    // Abertura e Fechamento do Menu Lateral
    document.getElementById("btn-open-drawer").onclick = () => { drawer.style.display = "block"; };
    drawer.onclick = (e) => { if (e.target === drawer) drawer.style.display = "none"; };

    // Botão + e Anexos
    document.getElementById("btn-toggle-menu").onclick = () => {
      mediaMenu.style.display = mediaMenu.style.display === "flex" ? "none" : "flex";
    };
    document.getElementById("btn-pick-photo").onclick = () => {
      mediaMenu.style.display = "none";
      document.getElementById("file-photo").click();
    };
    document.getElementById("btn-pick-video").onclick = () => {
      mediaMenu.style.display = "none";
      document.getElementById("file-video").click();
    };

    function processFiles(files) {
      if (!files || files.length === 0) return;
      Array.from(files).forEach(file => {
        if (file.size > 25 * 1024 * 1024) {
          alert(`O arquivo ${file.name} excede o limite recomendado de 25 MB.`);
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          mediaList.push({ name: file.name, type: file.type, data: e.target.result });
          mediaFilename.textContent = `📎 ${mediaList.length} arquivo(s) selecionado(s)`;
          mediaPreview.style.display = "flex";
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("file-photo").onchange = (e) => processFiles(e.target.files);
    document.getElementById("file-video").onchange = (e) => processFiles(e.target.files);
    document.getElementById("btn-remove-media").onclick = () => {
      mediaList = [];
      mediaPreview.style.display = "none";
    };

    // Configurações
    document.getElementById("btn-open-config").onclick = () => {
      document.getElementById("input-api-key").value = apiKey;
      document.getElementById("input-extra-memory").value = extraMemory;
      modalConfig.style.display = "flex";
    };
    document.getElementById("btn-close-config").onclick = () => { modalConfig.style.display = "none"; };
    document.getElementById("btn-save-config").onclick = () => {
      apiKey = document.getElementById("input-api-key").value.trim();
      extraMemory = document.getElementById("input-extra-memory").value.trim();
      localStorage.setItem("atena_api_key", apiKey);
      localStorage.setItem("atena_extra_memory", extraMemory);
      modalConfig.style.display = "none";
    };

    btnSend.onclick = sendMessage;
    inputMsg.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    updateHeader();
    renderChannels();
    renderChat();
  </script>
</body>
</html>
